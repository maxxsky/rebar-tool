# Template tipe elemen — didefinisikan sekali per proyek.
# Hanya 'balok' didukung di fase awal (kolom/plat menyusul F5/F7).
balok:
  B1:
    deskripsi: "Balok induk 300x600"
    b_mm: 300
    h_mm: 600
    tulangan:
      - posisi: "atas"
        dia: 19
        jumlah: 4
        tumpuan_kedua_ujung: true    # tambah Ld di kedua ujung
      - posisi: "bawah"
        dia: 19
        jumlah: 3
        tumpuan_kedua_ujung: true
      - posisi: "pinggang"
        dia: 13
        jumlah: 2
        tumpuan_kedua_ujung: true
    sengkang:
      dia: 10
      jarak_tumpuan_mm: 150
      jarak_lapangan_mm: 200
      kaki: 2                        # 2 kaki = sengkang tunggal persegi
      hook_sudut: 135

  B2:
    deskripsi: "Balok anak 250x500"
    b_mm: 250
    h_mm: 500
    tulangan:
      - { posisi: "atas",  dia: 16, jumlah: 3, tumpuan_kedua_ujung: true }
      - { posisi: "bawah", dia: 16, jumlah: 2, tumpuan_kedua_ujung: true }
    sengkang:
      dia: 10
      jarak_tumpuan_mm: 100
      jarak_lapangan_mm: 150
      kaki: 2
      hook_sudut: 135
