<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebar BBS — Verifikasi</title>
<link rel="stylesheet" href="/static/app.css?v=16">
</head>
<body>

<!-- ── header: brand + nav area + pilih proyek/gambar (lintas area) ── -->
<header class="top">
  <div class="brand">rebar <span class="sub">BBS</span></div>
  <nav class="area-nav" role="tablist" aria-label="Area">
    <button id="navKerja" class="area-tab active" data-area="kerja" role="tab">Kerja</button>
    <button id="navSetup" class="area-tab" data-area="setup" role="tab">Setup</button>
  </nav>
  <div class="projbar">
    <select id="projSelect" class="proj-select" aria-label="Proyek">
      <option value="">— pilih proyek —</option>
    </select>
    <select id="gbrSelect" class="proj-select" aria-label="Gambar" style="display:none">
      <option value="">— pilih gambar —</option>
    </select>
    <button id="btnNewGbr" class="btn" style="display:none">+ Gambar</button>
    <button id="btnNewProj" class="btn">+ Proyek baru</button>
  </div>
</header>

<!-- ══════════════ AREA KERJA — dipakai tiap hari ══════════════ -->
<main id="areaKerja" class="area">
  <!-- satu baris nilai teknis ringkas -->
  <div class="teknis-bar">
    <span id="projLabel" class="proj-label"></span>
    <span id="teknisRingkas" class="teknis-ringkas"></span>
    <a href="#" id="linkLihatSemua" class="link-lihat">lihat semua →</a>
  </div>

  <!-- form elemen -->
  <section class="panel" aria-label="Elemen">
    <div id="rowHead" class="row-head">
      <span>tipe</span><span>dimensi utama</span><span>jumlah</span><span>lokasi</span><span></span>
    </div>
    <div id="rows"></div>
    <button id="btnAdd" class="btn">+ baris</button>
    <div class="ovr-actions">
      <button id="btnHitung" class="btn primary">Hitung</button>
      <button id="btnExcel" class="btn">Export Excel</button>
      <details id="cobaPanel" class="coba-panel">
        <summary>▸ Coba nilai lain</summary>
        <div class="wiz-hint" style="margin:6px 0 8px">
          Untuk verifikasi F4: coba nilai sekali jalan tanpa mengubah config.
        </div>
        <div class="ovr-grid">
          <label>metode<select id="ovrMetode">
            <option value="">— ikut proyek —</option>
            <option value="kontinyu">kontinyu</option>
            <option value="per_zona">per_zona</option>
          </select></label>
          <label>zona tumpuan<input id="ovrZona" type="number" step="0.05" min="0" max="0.5" placeholder="—"></label>
          <label>kerf (mm)<input id="ovrKerf" type="number" step="1" min="0" placeholder="—"></label>
          <label>sisa min (mm)<input id="ovrSisaMin" type="number" step="50" min="0" placeholder="—"></label>
        </div>
      </details>
    </div>
  </section>

  <!-- statistik pemisah -->
  <div id="stats" class="stats" aria-live="polite"></div>

  <!-- hasil lebar penuh -->
  <section class="hasil" aria-label="Hasil">
    <div id="warnBanner" class="result-banner"></div>
    <div class="tabs">
      <button class="tab active" data-tab="bbs" role="tab">BBS</button>
      <button class="tab" data-tab="pola" role="tab">Pola potong</button>
    </div>
    <div id="tab-bbs" class="tab-body" role="tabpanel">
      <div class="kosong">Isi elemen di atas, lalu tekan Hitung.</div>
    </div>
    <div id="tab-pola" class="tab-body" style="display:none" role="tabpanel"></div>
  </section>
</main>

<!-- ══════════════ AREA SETUP — jarang dibuka ══════════════ -->
<main id="areaSetup" class="area" style="display:none">
  <aside class="setup-nav" aria-label="Setup">
    <button class="setup-item" data-page="proyek">Proyek</button>
    <button class="setup-item" data-page="gambar">Gambar <span id="cntGambar" class="cnt"></span></button>
    <button class="setup-item" data-page="teknis">Nilai teknis</button>
    <button class="setup-item" data-page="elemen">Elemen <span id="cntElemen" class="cnt"></span></button>
    <button class="setup-item" data-page="bentuk">Bentuk <span id="cntBentuk" class="cnt"></span></button>
  </aside>
  <section id="setupPage" class="setup-page"></section>
</main>

<!-- wizard proyek baru (hanya proyek yang benar-benar baru) -->
<div id="wizard" class="modal" style="display:none">
  <div class="modal-box">
    <div class="modal-head">
      <span id="wizTitle">Proyek baru</span>
      <button id="wizClose" class="del">✕</button>
    </div>
    <div id="wizBody" class="modal-body"></div>
    <div class="modal-foot">
      <button id="wizSave" class="btn primary" style="display:none">Simpan</button>
    </div>
  </div>
</div>

<!-- editor tipe elemen (dibuka dari Setup › Elemen) -->
<div id="elemModal" class="modal" style="display:none">
  <div class="modal-box">
    <div class="modal-head">
      <span>Kelola elemen — template proyek</span>
      <button class="del" onclick="elemModalClose()">✕</button>
    </div>
    <div class="modal-body" id="elemModalBody"></div>
    <div class="modal-foot">
      <button class="btn" onclick="elemModalClose()">Batal</button>
      <button class="btn primary" id="elemSave">Simpan elemen</button>
    </div>
  </div>
</div>

<!-- editor parameter proyek (dibuka dari Setup › Proyek / Nilai teknis) -->
<div id="paramModal" class="modal" style="display:none">
  <div class="modal-box">
    <div class="modal-head">
      <span>Edit parameter proyek</span>
      <button class="del" onclick="paramModalClose()">✕</button>
    </div>
    <div class="modal-body" id="paramModalBody"></div>
    <div class="modal-foot">
      <button class="btn" onclick="paramModalClose()">Batal</button>
      <button class="btn primary" id="paramSave">Simpan proyek</button>
    </div>
  </div>
</div>

<script src="/static/app.js?v=17"></script>
</body>
</html>
